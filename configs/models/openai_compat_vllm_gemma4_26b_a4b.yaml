# bwUniCluster/vLLM path for Gemma 4 26B-A4B (MoE, ~4B active params).
# base_url/api_key are read from environment variables so no secrets or
# node-specific addresses live in the scientific configuration.
#
# Served by cluster/bwunicluster3/model_profiles/gemma4_26b_a4b.sh with the
# gemma4 tool-call parser and BF16 weights.
name: "Gemma4-26B-A4B-it"
backend: "openai-compatible"
model_id: "google/gemma-4-26B-A4B-it"
family: "gemma4"
revision: "462a98a12e28e2cbcfccaf78fe41e3e50235e6ae"
dtype: "bfloat16"
device: "cuda"
served_model_name: "google/gemma-4-26B-A4B-it"
base_url: null
base_url_env: "OPENAI_COMPATIBLE_BASE_URL"
api_key_env: "OPENAI_COMPATIBLE_API_KEY"
# Non-thinking for this experiment, mirroring the Qwen calibration profile.
reasoning_mode: "non-thinking"
# Advisory: recorded in the manifest, must match the server launch flag.
tool_call_parser: "gemma4"
sampling:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
