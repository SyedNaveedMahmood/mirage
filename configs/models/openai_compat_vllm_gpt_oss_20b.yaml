# bwUniCluster/vLLM path for openai/gpt-oss-20b.
# base_url/api_key are read from environment variables so no secrets or
# node-specific addresses live in the scientific configuration.
#
# gpt-oss ships native MXFP4 weights: dtype/quantization below are *descriptive*
# provenance only and the server is launched WITHOUT a dtype or quantization
# override, so vLLM keeps the checkpoint's own MXFP4 path (see
# cluster/bwunicluster3/model_profiles/gpt_oss_20b.sh).
name: "GPT-OSS-20B"
backend: "openai-compatible"
model_id: "openai/gpt-oss-20b"
family: "gpt-oss"
revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
dtype: "auto"
quantization: "mxfp4"
device: "cuda"
served_model_name: "openai/gpt-oss-20b"
base_url: null
base_url_env: "OPENAI_COMPATIBLE_BASE_URL"
api_key_env: "OPENAI_COMPATIBLE_API_KEY"
# gpt-oss has no enable_thinking boolean; its reasoning knob is the Harmony
# `reasoning_effort` string, so reasoning_mode stays "auto" and the effort is
# declared through the generic chat-template passthrough instead.
reasoning_mode: "auto"
chat_template_kwargs:
  reasoning_effort: "low"
# Advisory: recorded in the manifest, must match the server launch flag.
tool_call_parser: "openai"
sampling:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
