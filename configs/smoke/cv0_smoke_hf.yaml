# CV-0 smoke -- tiny REAL model (Qwen2.5-1.5B) in-process on the 12 GB 2060.
# Measures the REAL decoder-determinism envelope and exercises token accounting,
# invalid-action rate, and one real potency exposure. Small N by design (2060).
# Fetch the model first: scripts/fetch_smoke_model.ps1
extends: "../base.yaml"

experiment_id: "cv0_smoke_hf"
notes: "Tiny real-model (Qwen2.5-1.5B) decoder-determinism smoke on the 2060."

substrate:
  suites: ["banking"]

budget:
  max_steps: 8
  wall_clock_s: 300.0

models:
  - "../models/hf_qwen2p5_1p5b.yaml"

scaffolds:
  - "../scaffolds/s1_react.yaml"

determinism_audit:
  n_checkpoints: 3
  n_twin_restores: 2
  K: 4
  greedy_horizon: 4
  stochastic_horizon: 4
  branch_horizon_for_epsilon: 3

capability_screen:
  rollouts_per_cell: 2
  max_checkpoints_per_rollout: 3
  max_tasks_per_suite: 2         # keep the real-model run brief on the 2060
  branch_probe_K: 2
  branch_probe_horizon: 2
  eligibility:
    total_rollouts: 2
    min_reachable_rollouts: 1
    min_subgoals: 0
    min_remaining_steps: 1
    min_viable_continuations: 1
    require_exact_twin_digest: false

potency_screen:
  intervention_classes: ["injected_instruction", "benign_artifact"]  # 1 class + BA control
  n_checkpoints: 1
  n_exposures: 1

variance_estimation:
  outcomes: ["Y_branch_3", "Y_prog_T"]
  method: "mom"
  power_table_K: [8, 16]
  power_table_delta: [0.10, 0.05]

gates:
  # Real small model: decoder determinism may be < 1.0; the smoke REPORTS the
  # envelope rather than gating hard on it. Count gates are smoke scale.
  digest_equality_min: 0.50
  twin_null_branch_mean_max: 0.30
  twin_null_branch_p95_max: 0.50
  eligible_per_cell_min: 1
  potency_pp_above_ba_min: 0.0
  invalid_action_max: 1.0
  min_families_pass_capability: 1
  kill_digest_equality: 0.0
  kill_twin_null_mean: 1.0
  kill_min_families: 1
